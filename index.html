<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plot and compare functions in 2D or surfaces in 3D, inspect coordinates, and find their intersections.">
  <title>Function and Surface Grapher</title>
  <link rel="stylesheet" href="./style.css?v=1.1.1">
  <script type="module" src="./app.mjs?v=1.1.1"></script>
</head>
<body>
<main>
  <div class="heading">
    <div><h1>Function and Surface Grapher</h1><p>Compare equations, inspect points, and see where curves and surfaces meet.</p></div>
    <a href="https://github.com/netcodermike/function-surface-grapher">Project source ↗</a>
  </div>
  <div class="workspace">
    <section class="panel stage" aria-label="Project workspace">
      <div class="plot-frame">
        <canvas id="plot" width="810" height="475" tabindex="0" role="img" aria-label="Mathematical graph" aria-describedby="plot-help">Mathematical graph</canvas>
        <canvas id="plot-overlay" width="810" height="475" aria-hidden="true"></canvas>
      </div>
      <p id="reading" class="sr-only" role="status"></p>
      <ul id="plot-legend" aria-label="Plotted expressions"></ul>
      <div class="probe-panel">
        <div>
          <strong id="probe-title">Coordinates</strong>
          <p id="probe-values">Hover or tap the graph to inspect a point.</p>
        </div>
        <button id="clear-pin" type="button" hidden>Clear pin</button>
      </div>
      <p id="probe-announcement" class="sr-only" role="status"></p>
      <p id="plot-details"></p>
      <p id="plot-help"></p>
      <section id="solution-panel" class="solution-panel" hidden aria-labelledby="solution-title">
        <div class="solution-heading">
          <h2 id="solution-title">Intersection solutions</h2>
          <label class="check"><input id="show-intersections" type="checkbox" checked> Highlight on graph</label>
        </div>
        <p id="intersection-summary"></p>
        <button id="toggle-solutions" type="button" aria-controls="solution-points" aria-expanded="false" hidden>Show all intersections</button>
        <ul id="solution-points"></ul>
      </section>
    </section>
    <section class="panel controls" aria-label="Controls">
      <form id="controls" novalidate>
<label>Example <select id="example"><option value="">Custom expression</option><optgroup label="Surfaces"><option value="ripple">Radial ripple</option>
<option value="saddle">Saddle</option><option value="hills">Periodic hills</option>
<option value="compare-surfaces">Intersecting planes</option></optgroup>
<optgroup label="Curves"><option value="sine">Harmonic curve</option><option value="cubic">Cubic</option>
<option value="reciprocal">Reciprocal</option><option value="compare-curves">Sine and cosine</option></optgroup></select></label>
<label>Graph type <select id="mode"><option value="2d">2D curve · y = f(x)</option><option value="3d">3D surface · z = f(x, y)</option></select></label>
<div id="series-inputs">
  <label class="series-field" data-series="0"><span>Expression 1</span><input id="formula" class="serial-expression" type="text" maxlength="256" required autocomplete="off" spellcheck="false"></label>
</div>
<button id="add-series" type="button">Add expression</button>

<fieldset><legend>Plot bounds</legend>
<div class="pair"><label>x minimum <input id="xmin" type="number" step="any" required></label>
<label>x maximum <input id="xmax" type="number" step="any" required></label></div>
<div class="pair"><label>y minimum <input id="ymin" type="number" step="any" required></label>
<label>y maximum <input id="ymax" type="number" step="any" required></label></div>
</fieldset>

<label>Axis scale <select id="axis-scale"><option value="fit">Fit each axis</option><option value="equal">Equal units</option></select></label>
<button type="submit">Plot expressions</button>
<div class="actions"><button id="zoom-in" type="button">Zoom in</button>
<button id="zoom-out" type="button">Zoom out</button>
<button id="reset-view" type="button">Reset view</button></div>
<div id="rotate-controls" class="actions"><button id="turn-left" type="button">Rotate left</button>
<button id="turn-right" type="button">Rotate right</button></div>
<p>Write products with <code>*</code>, such as <code>2*x</code>.</p>
<p class="error" id="error" role="alert"></p>
</form>
    </section>
  </div>
</main>
</body>
</html>
